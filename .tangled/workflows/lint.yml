# lint — fast-feedback CI: every check that needs no host closure.
when:
  - event: ["push", "pull_request"]
    branch: main

engine: microvm
image: nixos

# No `dependencies:`: the base image already ships git, curl, jq and nix, and any such key
# adds a guest activation step (~60 s); check nix/microvm/base.nix first.

steps:
  # --accept-flake-config makes abort-on-warn apply. No deploy-* checks or `nix flake check`:
  # they build every host's closure, aarch64 pioneer included.
  - name: lint and format
    command: |
      nix build \
        --accept-flake-config \
        --no-write-lock-file \
        --override-input nix-secrets ./.tangled/nix-secrets-stub \
        --print-build-logs \
        .#checks.x86_64-linux.treefmt \
        .#checks.x86_64-linux.pre-commit \
        .#checks.x86_64-linux.check-flake-file \
        .#checks.x86_64-linux.default-shell \
        .#checks.x86_64-linux.docs

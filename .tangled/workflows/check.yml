# The gate that matters: do the servers still build?
#
# `abort-on-warn = true` turns any nixpkgs or home-manager eval warning into a
# hard failure, so an upstream deprecation does not degrade this fleet, it
# breaks it — and without CI the place that happens is a deploy. This moves it
# to the push.
#
# Three hosts, not four. pioneer is left out because it is aarch64 and
# endeavour has no binfmt — neither this host nor the guest can emulate it, so
# a workflow could only ever substitute its closure from attic, and would go
# red whenever voyager had not built it yet. `nix eval` of pioneer still
# happens implicitly wherever the flake is evaluated; what is missing is a
# build, and the machine that can do that build is voyager.
#
# Cheapest first, which matters because a `nix build` reports the first failure
# and abandons the rest: gaia is a small VPS closure, endeavour a large server
# one, and voyager the desktop with nvidia, Steam, OBS and FreeCAD in it. A
# breakage that affects everything now surfaces in minutes rather than after
# the biggest host has finished.
#
# See lint.yml for what --accept-flake-config and --override-input are doing;
# both are load-bearing and neither is obvious from reading the command.
when:
  - event: ["push", "pull_request"]
    branch: main

engine: microvm
image: nixos

dependencies:
  - git

steps:
  # Built one at a time rather than in a single invocation: a `nix build` of
  # both reports the first failure and abandons the rest, and when the question
  # is "which host did this break" the answer should not require a second run.
  #
  # Substitution comes from attic via the spindle's host-side cache proxy
  # (services/tangled.nix), so much of this is a download of what voyager
  # already built rather than a rebuild.
  - name: build gaia
    command: |
      nix build \
        --accept-flake-config \
        --no-write-lock-file \
        --override-input nix-secrets ./.tangled/nix-secrets-stub \
        --print-build-logs \
        .#nixosConfigurations.gaia.config.system.build.toplevel

  - name: build endeavour
    command: |
      nix build \
        --accept-flake-config \
        --no-write-lock-file \
        --override-input nix-secrets ./.tangled/nix-secrets-stub \
        --print-build-logs \
        .#nixosConfigurations.endeavour.config.system.build.toplevel

  - name: build voyager
    command: |
      nix build \
        --accept-flake-config \
        --no-write-lock-file \
        --override-input nix-secrets ./.tangled/nix-secrets-stub \
        --print-build-logs \
        .#nixosConfigurations.voyager.config.system.build.toplevel

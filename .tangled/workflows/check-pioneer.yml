# pioneer, best effort, and separate so its failure is its own red mark.
#
# pioneer is aarch64. voyager builds it under `boot.binfmt.emulatedSystems`;
# endeavour, where this runs, has none — `/run/binfmt/` is empty — and the
# microVM guest inherits nothing of the sort. So this workflow can only ever
# *substitute* pioneer's closure, never build it.
#
# That is not as useless as it sounds. voyager pushes what it builds to attic,
# and the spindle reads from attic, so on any push that does not change
# pioneer's closure this succeeds in seconds and confirms the closure is
# reachable to a deploy. When it does change, this goes red with a "cannot
# build for aarch64-linux" and the honest reading is "voyager has not built
# this yet", not "pioneer is broken".
#
# Kept out of check.yml precisely so that distinction stays visible. If it
# becomes noise, the fix is `boot.binfmt.emulatedSystems` on endeavour and
# moving this into check.yml — at the cost of emulated aarch64 builds on the
# host that runs everything else.
when:
  - event: ["push", "pull_request"]
    branch: main

engine: microvm
image: nixos

dependencies:
  - git

steps:
  # Evaluation is native regardless of target architecture, and it catches the
  # failure mode that actually recurs here — a warning or a bad option — even
  # when the build itself cannot proceed. Worth having as its own step so the
  # log distinguishes "pioneer's config is wrong" from "pioneer's closure is
  # not in the cache yet".
  #
  # See lint.yml for what --accept-flake-config and --override-input do.
  - name: evaluate pioneer
    command: |
      nix eval \
        --accept-flake-config \
        --no-write-lock-file \
        --override-input nix-secrets ./.tangled/nix-secrets-stub \
        --raw \
        .#nixosConfigurations.pioneer.config.system.build.toplevel.drvPath

  - name: substitute pioneer
    command: |
      nix build \
        --accept-flake-config \
        --no-write-lock-file \
        --override-input nix-secrets ./.tangled/nix-secrets-stub \
        --print-build-logs \
        .#nixosConfigurations.pioneer.config.system.build.toplevel

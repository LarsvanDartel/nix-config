# The gate that matters: do the servers still build?
#
# `abort-on-warn = true` turns any nixpkgs or home-manager eval warning into a
# hard failure, so an upstream deprecation does not degrade this fleet, it
# breaks it — and without CI the place that happens is a deploy. This moves it
# to the push.
#
# Three hosts, not four. pioneer is left out because it is aarch64 and
# endeavour has no binfmt — neither this host nor the guest can emulate it, so
# a workflow could only ever substitute its closure from attic, and would go
# red whenever voyager had not built it yet. `nix eval` of pioneer still
# happens implicitly wherever the flake is evaluated; what is missing is a
# build, and the machine that can do that build is voyager.
#
# See lint.yml for what --accept-flake-config and --override-input are doing;
# both are load-bearing and neither is obvious from reading the command.
#
# No --print-build-logs, unlike lint.yml. Every line a step emits crosses the
# host↔guest vsock, and streaming every builder's full output killed that
# channel 23 minutes into a build:
#
#   read agent message: read vsock host(2):10240->vm(23921): no buffer space
#
# The build had not failed — the transport carrying its output had, with the
# guest agent writing faster than the host drained it. Little is lost: nix
# still prints the tail of a *failing* builder's log without -L, which is the
# part anyone reads. lint.yml keeps it because its output is kilobytes.
# push only, deliberately. Since services/tangled.nix set uploadUrl = "daemon",
# anything a guest builds lands in endeavour's store and watch-store publishes
# it to the cache the whole fleet substitutes from. A push comes from someone
# who can already write to main, so that grants nothing new. A pull_request
# from a fork would be an untrusted build whose output becomes a path the fleet
# trusts — so that trigger is gone rather than the upload.
#
# The consequence to know: a PR gets no CI. If this repo ever takes outside
# contributions, the way back is to unset uploadUrl and restore the trigger,
# not to restore the trigger alone.
when:
  - event: ["push"]
    branch: main

engine: microvm
image: nixos

dependencies:
  - git

steps:
  # One invocation for all three, not one step each.
  #
  # It was three steps so that a red mark named the host that broke. That cost
  # more than it was worth: each step re-evaluated the whole flake from
  # scratch — a minute of pure eval, three times — and nothing overlapped, so
  # three hosts that share almost their entire closure were built strictly one
  # after another. A cold run took 46 minutes just to *reach* the third.
  #
  # --keep-going is what makes this an equal trade rather than a worse one: a
  # nix build without it reports the first failure and abandons the rest, which
  # is precisely the "which host did this break" problem in a new place. With
  # it, every host that fails is reported in one run. What is lost is only that
  # the failures arrive as one red step instead of three.
  #
  # Substitution comes from attic via the spindle's host-side cache proxy, and
  # what the guest builds is uploaded back into endeavour's store, where
  # watch-store publishes it (services/tangled.nix). So the second run of
  # anything is a download rather than a rebuild.
  - name: build all three x86_64 hosts
    command: |
      nix build \
        --accept-flake-config \
        --no-write-lock-file \
        --override-input nix-secrets ./.tangled/nix-secrets-stub \
        --keep-going \
        .#nixosConfigurations.gaia.config.system.build.toplevel \
        .#nixosConfigurations.endeavour.config.system.build.toplevel \
        .#nixosConfigurations.voyager.config.system.build.toplevel

# The gate that matters: do the servers still build?
#
# `abort-on-warn = true` turns any nixpkgs or home-manager eval warning into a
# hard failure, so an upstream deprecation does not degrade this fleet, it
# breaks it — and without CI the place that happens is a deploy. This moves it
# to the push.
#
# Two hosts, not four, and both omissions are deliberate:
#
#   voyager  — the desktop, and by a wide margin the largest closure here
#              (nvidia, Steam, OBS, FreeCAD, Zotero). The first real run spent
#              38 minutes on it and then OOMed the guest, without ever reaching
#              the two hosts anyone deploys remotely. It is also the host you
#              always build locally before switching, so CI was re-proving
#              something you find out about immediately anyway.
#   pioneer  — aarch64, and endeavour has no binfmt. See check-pioneer.yml.
#
# Cheapest first. gaia is a small VPS closure and endeavour a large server one,
# so if something breaks broadly the failure arrives in a couple of minutes
# instead of twenty.
#
# See lint.yml for what --accept-flake-config and --override-input are doing;
# both are load-bearing and neither is obvious from reading the command.
when:
  - event: ["push", "pull_request"]
    branch: main

engine: microvm
image: nixos

dependencies:
  - git

steps:
  # Built one at a time rather than in a single invocation: a `nix build` of
  # both reports the first failure and abandons the rest, and when the question
  # is "which host did this break" the answer should not require a second run.
  #
  # Substitution comes from attic via the spindle's host-side cache proxy
  # (services/tangled.nix), so much of this is a download of what voyager
  # already built rather than a rebuild.
  - name: build gaia
    command: |
      nix build \
        --accept-flake-config \
        --no-write-lock-file \
        --override-input nix-secrets ./.tangled/nix-secrets-stub \
        --print-build-logs \
        .#nixosConfigurations.gaia.config.system.build.toplevel

  - name: build endeavour
    command: |
      nix build \
        --accept-flake-config \
        --no-write-lock-file \
        --override-input nix-secrets ./.tangled/nix-secrets-stub \
        --print-build-logs \
        .#nixosConfigurations.endeavour.config.system.build.toplevel
